name: MSBuild

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        msbuild /m /p:platform=x64 /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
        msbuild /m /p:platform=x86 /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Run tests
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cmake -S tests -B build-tests -A x64
        cmake --build build-tests --config ${{env.BUILD_CONFIGURATION}}
        ctest --test-dir build-tests -C ${{env.BUILD_CONFIGURATION}} --output-on-failure

    - name: Prepare Metadata
      id: setup
      run: |
        VER=$(grep VER_SNAP src/version.h | cut -d'"' -f2)
        echo "version=$VER" >> $GITHUB_OUTPUT
        HASH=$(git rev-parse --short HEAD)
        echo "commitHash=$HASH" >> $GITHUB_OUTPUT
        VER=${GITHUB_REF#refs/tags/}
        if [[ ${GITHUB_REF} = "refs/heads/master" ]]; then
          VER=latest
        fi
        if [[ ${GITHUB_REF} = "refs/pull/"* ]]; then
          VER=PR-${GITHUB_REF#refs/pull/}
          VER=${VER%/merge}
        fi
        echo rel=${VER} >> $GITHUB_OUTPUT
      shell: bash

    - name: Build package
      run: |
        $env:PATH += ';C:\Program Files (x86)\NSIS\'
        cd setup

        echo "!undef RELVERSION" > ver.nsi
        echo "!define RELVERSION ""${{ steps.setup.outputs.version }}""" >> ver.nsi
        echo "!define DEVREL" >> ver.nsi

        cat ver.nsi

        makensis.exe /DOUTPUTFILE=..\Saenaru-${{ steps.setup.outputs.version }}-${{ steps.setup.outputs.rel }}-${{ steps.setup.outputs.commitHash }}.exe saenaru.nsi
        dir ..\*.exe
      shell: pwsh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Saenaru-${{ steps.setup.outputs.version }}-${{ steps.setup.outputs.rel }}-${{ steps.setup.outputs.commitHash }}
        path: |
          ${{ github.workspace }}\Saenaru-*.exe

    # Release build with DEBUG=1 for DebugView. Debug builds need the debug CRT.
    - name: Build with debug log
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        $env:CL = '/DDEBUG=1'
        foreach ($p in 'x64', 'x86') {
          msbuild /m /p:platform=$p /p:Configuration=${{env.BUILD_CONFIGURATION}} "/p:OutDir=${{ github.workspace }}\debuglog\$p\" "/p:IntDir=debuglog\$p\" ${{env.SOLUTION_FILE_PATH}}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      shell: pwsh

    - name: Upload Debug Log Build
      uses: actions/upload-artifact@v7
      with:
        name: Saenaru-debuglog-${{ steps.setup.outputs.rel }}-${{ steps.setup.outputs.commitHash }}
        path: |
          ${{ github.workspace }}\debuglog\*\Saenaru.ime
          ${{ github.workspace }}\debuglog\*\SaenaruTip.dll

  # the same tests on Linux with clang-cl, the MSVC CRT/SDK of xwin and wine
  linux-tests:
    runs-on: ubuntu-latest
    env:
      XWIN_VERSION: 0.10.0
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=

    steps:
    - uses: actions/checkout@v7

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 wine wine64
        echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

    - name: Install the MSVC CRT/SDK with xwin
      run: |
        X=xwin-$XWIN_VERSION-x86_64-unknown-linux-musl
        curl -sSLO https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/$X.tar.gz
        curl -sSLO https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/$X.tar.gz.sha256
        echo "$(cut -d' ' -f1 $X.tar.gz.sha256)  $X.tar.gz" | sha256sum -c
        tar xzf $X.tar.gz
        # accepts the Microsoft license of the CRT/SDK
        ./$X/xwin --accept-license splat --output $HOME/.xwin

    - name: Run tests
      run: |
        cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$PWD/tests/clang-cl-xwin.cmake
        cmake --build build-tests
        ctest --test-dir build-tests --output-on-failure

  make-release:
    name: Create and upload release
    runs-on: windows-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    needs: [build]
    defaults:
      run:
        shell: bash

    steps:
      - name: Get Metadata
        id: metadata
        run: |
          ## METADATA SCRIPT
          echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Generate Checksums
        run: |
          ## CHECKSUM GENERATION SCRIPT
          shopt -s extglob
          echo "### Checksums" > "${{ github.workspace }}/CHECKSUMS.txt"
          for file in "${{ github.workspace }}"/**/@(*.pkg|*.exe|*.deb|*.zip|*.tgz); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> "${{ github.workspace }}/CHECKSUMS.txt"
          done
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(steps.metadata.outputs.version, 'rc') || contains(steps.metadata.outputs.version, 'beta') }}
          tag_name: ${{ steps.metadata.outputs.version }}
          name: "Saenaru ${{ steps.metadata.outputs.version }}"
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/**/*.zip
            ${{ github.workspace }}/**/*.exe
            ${{ github.workspace }}/**/*.deb
            ${{ github.workspace }}/**/*.tgz
            ${{ github.workspace }}/**/*.pkg
